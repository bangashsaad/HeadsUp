<!-- ==================== APP SHELL ==================== -->
<sc-if value="{{ isApp }}" hint-placeholder-val="{{ false }}">
<div style="min-height:100vh;display:flex">

  <!-- sidebar -->
  <div style="width:230px;flex:none;display:flex;flex-direction:column;border-right:1px solid #1A1E2B;background:#0D0F16;position:sticky;top:0;height:100vh;box-sizing:border-box">
    <div sc-camel-on-click="{{ goLanding }}" style="cursor:pointer;padding:24px 22px 20px;display:flex;flex-direction:column">
      <span style="font-family:'Archivo Black',sans-serif;font-style:italic;font-size:23px;letter-spacing:-.5px;line-height:1"><span style="color:#F4F5F7">HEADS</span><span style="color:var(--acc,#C8FF2E)">UP</span></span>
      <span style="font-size:9px;font-weight:800;letter-spacing:3.5px;color:#565D73;margin-top:3px">FANTASY DUELS</span>
    </div>
    <div style="padding:0 12px;display:flex;flex-direction:column;gap:3px">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <div sc-camel-on-click="{{ n.go }}" style="cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;background:{{ n.bg }};border:1px solid {{ n.border }}" style-hover="background:#151827">
          <span style="width:16px;height:16px;flex:none;background:{{ n.ink }};-webkit-mask:url('{{ n.icon }}') center/contain no-repeat;mask:url('{{ n.icon }}') center/contain no-repeat"></span>
          <span style="font-weight:800;font-size:12.5px;letter-spacing:.5px;color:{{ n.ink }}">{{ n.label }}</span>
          <sc-if value="{{ n.live }}" hint-placeholder-val="{{ false }}">
            <span style="margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:rgba(255,69,87,.15);border:1px solid #FF4557;border-radius:999px;padding:2px 7px"><span style="width:5px;height:5px;border-radius:3px;background:#FF4557;animation:huw-blink 1.1s infinite"></span><span style="color:#FF4557;font-size:9px;font-weight:900;letter-spacing:1px">LIVE</span></span>
          </sc-if>
          <sc-if value="{{ n.count }}" hint-placeholder-val="{{ false }}">
            <span style="margin-left:auto;font-size:10px;font-weight:800;color:#565D73">{{ n.count }}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <div style="padding:16px 12px">
      <div sc-camel-on-click="{{ goNew }}" style="cursor:pointer;background:var(--acc,#C8FF2E);color:#0A0B10;border-radius:12px;padding:12px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;font-size:17px;letter-spacing:.5px;animation:huw-pulse 2.6s infinite" style-hover="filter:brightness(1.08)" style-active="transform:scale(.98)">+ NEW CHALLENGE</div>
    </div>
    <div style="margin:0 12px;display:flex;align-items:center;gap:9px;border:1px solid #252A3A;background:#12141D;border-radius:12px;padding:10px 14px">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;font-size:17px;color:#FFB021">◎ {{ coins }}</span>
      <span style="font-size:9.5px;font-weight:900;letter-spacing:1.5px;color:#565D73">COIN WALLET</span>
    </div>
    <div sc-camel-on-click="{{ goProfile }}" style="cursor:pointer;margin-top:auto;padding:15px 14px;border-top:1px solid #1A1E2B;display:flex;align-items:center;gap:10px" style-hover="background:#12141D">
      <div style="width:36px;height:36px;flex:none;border-radius:11px;background:linear-gradient(135deg,rgba(200,255,46,.22),#7C5CFF33);border:1px solid rgba(200,255,46,.4);display:flex;align-items:center;justify-content:center"><span style="color:var(--acc,#C8FF2E);font-weight:800;font-size:14px">S</span></div>
      <div style="display:flex;flex-direction:column;min-width:0">
        <span style="font-weight:800;font-size:13px">sp1ke</span>
        <span style="font-size:11px;color:#8B91A7;font-weight:600">12–8 · 🔥 W3</span>
      </div>
      <span style="margin-left:auto;width:14px;height:14px;background:#565D73;-webkit-mask:url(&quot;554da2f0-134f-4005-b8cd-c03f73c47835&quot;) center/contain no-repeat;mask:url(&quot;554da2f0-134f-4005-b8cd-c03f73c47835&quot;) center/contain no-repeat"></span>
    </div>
  </div>

  <!-- main column -->
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">

    <div style="border-bottom:1px solid #1A1E2B;background:#0D0F16;overflow:hidden;white-space:nowrap">
      <div style="display:inline-flex;gap:34px;padding:9px 0;animation:huw-marq 26s linear infinite">
        <sc-for list="{{ tickerLoop }}" as="t" hint-placeholder-count="8">
          <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;display:inline-flex;gap:9px;align-items:center"><span style="color:{{ t.tagColor }};font-weight:800">{{ t.tag }}</span><span style="color:#F4F5F7">{{ t.line }}</span><span style="color:#565D73">{{ t.meta }}</span></span>
        </sc-for>
      </div>
    </div>
